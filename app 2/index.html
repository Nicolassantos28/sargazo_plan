<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Atención del sargazo</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5efe3;color:#1d211f;font:15px/1.5 "Noto Sans","Helvetica Neue",Arial,system-ui,sans-serif;display:flex;flex-direction:column}
header{background:#fff;padding:12px 24px;border-bottom:4px solid #235b4e;box-shadow:inset 0 -7px 0 -4px #bc955c}
header img{height:44px;width:auto;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.box{width:100%;max-width:420px;background:#fffcf6;border:1px solid #e2d7c2;border-radius:8px;padding:28px 28px 24px}
.eb{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9d7a3c}
h1{margin:6px 0 4px;font-size:22px;line-height:1.25;color:#235b4e}
p.sub{margin:0 0 20px;color:#5f5b52;font-size:14px}
label{display:block;font-size:13px;font-weight:600;color:#5f5b52;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cdbf a6;border:1px solid #cfc3a9;border-radius:6px;background:#fff}
input[type=password]:focus{outline:2px solid #235b4e;outline-offset:1px;border-color:#235b4e}
.rec{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:13.5px;color:#5f5b52;font-weight:400}
.rec input{accent-color:#235b4e;width:16px;height:16px}
button{width:100%;font:inherit;font-weight:700;font-size:15px;color:#fff;background:#235b4e;border:0;border-radius:6px;padding:11px 14px;cursor:pointer}
button:hover{background:#10312b}button:disabled{opacity:.7;cursor:wait}
.err{color:#9b2247;font-size:13.5px;min-height:20px;margin:10px 0 0}
footer{padding:14px 24px;font-size:12px;color:#5f5b52;text-align:center}
</style></head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);};
async function abrir(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const b=b64(BLOB); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));
  const html=new TextDecoder().decode(pt);
  sessionStorage.setItem('sgz_k',tob64(raw));
  document.open(); document.write(html); document.close();
}
(async()=>{ let r=null; try{ r=sessionStorage.getItem('sgz_k')||localStorage.getItem('sgz_k'); }catch(e){}
  if(r){ try{ await abrir(b64(r)); return; }catch(e){ try{sessionStorage.removeItem('sgz_k');localStorage.removeItem('sgz_k');}catch(x){} } } })();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); const bt=document.getElementById('b'), er=document.getElementById('err'); er.textContent=''; bt.disabled=true; bt.textContent='Verificando…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveBits']);
    const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:IT,hash:'SHA-256'},km,256);
    try{ if(document.getElementById('rec').checked) localStorage.setItem('sgz_k',tob64(raw)); }catch(e){}
    await abrir(raw);
  }catch(e){ try{localStorage.removeItem('sgz_k');}catch(x){} er.textContent='Contraseña incorrecta.'; bt.disabled=false; bt.textContent='Entrar'; }
});
